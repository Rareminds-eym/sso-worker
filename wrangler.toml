name = "sso-api"
main = "src/index.ts"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787
inspector_port = 9227

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[triggers]
crons = ["0 3 * * *"]

[vars]
ENVIRONMENT = "production"
JWKS_FRESHNESS_SECONDS = "300"
SUPABASE_URL = "https://quvdgaydpctuspzeqknc.supabase.co"
SKILLPASSPORT_URL = "https://skillpassport.rareminds.in"
ALLOWED_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://localhost:8788,http://localhost:8789,https://*.rareminds.in,https://*.pages.dev,http://127.0.0.1:8788,http://127.0.0.1:8789"
ALLOWED_APP_URLS = "http://localhost:3000,http://localhost:3000/,http://localhost:3000/auth/callback,http://127.0.0.1:3000,http://127.0.0.1:3000/auth/callback,http://localhost:5173,http://localhost:8788,http://localhost:8789,http://localhost:8789/auth/callback,http://127.0.0.1:8788,http://127.0.0.1:8789,http://127.0.0.1:8789/auth/callback,https://skillpassport.rareminds.in,https://*.rareminds.in,https://*.pages.dev"

# Secrets (set via `wrangler secret put`):
# SUPABASE_SERVICE_ROLE_KEY
# JWT_PRIVATE_KEY  (PEM-encoded RS256 private key)
# JWT_PUBLIC_KEY   (PEM-encoded RS256 public key)
# JWT_KID          (Key ID for JWKS, e.g. "key-1")

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "a162f140e4464515a8d5a27b5ebc6c6b"

[[durable_objects.bindings]]
name = "AUTH_CODE_STORE"
class_name = "AuthorizationCodeStore"

[[migrations]]
tag = "v1_authorization_code_store"
new_sqlite_classes = ["AuthorizationCodeStore"]

[[services]]
binding = "EMAIL_SERVICE"
service = "shared-email-api"
entrypoint = "EmailService"

[[queues.producers]]
binding = "SYNC_QUEUE"
queue = "auth-db-sync-queue"

[[queues.producers]]
binding = "LEARNER_ADMISSION_QUEUE"
queue = "learner-admission-queue"

[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "email-queue"

[[queues.consumers]]
queue = "payment-webhooks-queue"
max_batch_size = 10
max_batch_timeout = 5

[[queues.consumers]]
queue = "sso-reverse-sync-queue"
max_batch_size = 10
max_batch_timeout = 5

[[queues.consumers]]
queue = "learner-admission-queue"
max_retries = 3
max_concurrency = 1
dead_letter_queue = "learner-admission-dlq"

[[queues.consumers]]
queue = "learner-admission-dlq"

